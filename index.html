'use strict';
const KEY='min-bank-exam-dir-v1';const DRAFT_KEY='min-bank-exam-active-draft-v17';const SCHEMA=1;let root=null,db=null,data={questions:[],topics:[],attempts:[],templates:[]},page='home',editId=null,working=null,study=null,ready=false,saveBusy=false,draftWriteSeq=0;
const $=s=>document.querySelector(s);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const uid=()=>crypto.randomUUID?crypto.randomUUID():String(Date.now())+Math.random().toString(36).slice(2);const now=()=>new Date().toISOString();const formatDate=v=>v?new Date(v).toLocaleString('vi-VN'):'—';const num=v=>Number.isFinite(+v)?+v:0;const show=(msg,bad=false)=>{const e=$('#toast');e.textContent=msg;e.style.background=bad?'#923040':'#142e4a';e.style.display='block';clearTimeout(show.t);show.t=setTimeout(()=>e.style.display='none',4500)};
const names={home:'Tổng quan',study:'Học & luyện tập',setup:'Chọn chế độ thi',exam:'Làm bài thi',review:'Sổ tay ôn tập',results:'Kết quả & lịch sử',detail:'Chi tiết bài thi',questions:'Ngân hàng câu hỏi',topics:'Danh mục chủ đề',storage:'Nguồn dữ liệu & sao lưu',help:'Hướng dẫn sử dụng'};
function go(p){
  // KHÓA điều hướng toàn cục trong thời gian làm bài: không có ngoại lệ cho menu/đường tắt.
  if(working&&p!=='exam'){
    if(page==='exam')grabAnswer();
    writeDraft();
    alert('BẠN ĐANG LÀM BÀI THI!\n\nKhông thể chuyển sang tab khác khi bài chưa nộp.\nVui lòng NỘP BÀI hoặc HỦY BÀI THI (có xác nhận) trước khi rời màn thi.\n\nCâu trả lời hiện tại được giữ nguyên.');
    return false;
  }
  page=p;
  document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===p));
  $('#pagetitle').textContent=names[p]||p;
  render();return true;
};document.addEventListener('click',e=>{let b=e.target.closest('[data-page]');if(b)go(b.dataset.page)});$('#quickconnect').onclick=()=>go('storage');
function requireReady(){if(!ready){show('Vui lòng kết nối thư mục dữ liệu trước khi sử dụng.',true);go('storage');return false}return true}function updateStatus(){ $('#status').textContent=ready?`Đã kết nối: ${root.name}`:root?'Cần cấp lại quyền':'Chưa kết nối';$('#status').style.color=ready?'#12613d':'#8d5c21'}
function openIDB(){return new Promise((res,rej)=>{let req=indexedDB.open('min-bank-exam-settings',1);req.onupgradeneeded=()=>req.result.createObjectStore('settings');req.onsuccess=()=>res(req.result);req.onerror=()=>rej(req.error)})}function idbGet(k){return new Promise((res,rej)=>{let r=db.transaction('settings').objectStore('settings').get(k);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}function idbSet(k,v){return new Promise((res,rej)=>{let r=db.transaction('settings','readwrite').objectStore('settings').put(v,k);r.onsuccess=()=>res();r.onerror=()=>rej(r.error)})}
async function pickDir(){if(working){go('storage');return}if(!window.showDirectoryPicker){show('Trình duyệt này không hỗ trợ chọn thư mục. Hãy sử dụng Edge/Chrome có API File System Access.',true);return}try{let h=await window.showDirectoryPicker({mode:'readwrite'});if(working){grabAnswer();writeDraft();if(!confirm('Bạn có bài thi CHƯA NỘP. Đổi kho dữ liệu có thể khiến không thể tiếp tục bài thi này. Chọn OK để HỦY bài đang thi và đổi kho, hoặc Cancel để tiếp tục làm bài.'))return}else if(ready&&!confirm('Đổi thư mục sẽ chuyển sang kho dữ liệu khác, KHÔNG chuyển dữ liệu cũ. Tiếp tục?'))return;if(working){working=null;clearExamDraft()}root=h;ready=false;await idbSet(KEY,h);await connect(true);go('storage')}catch(e){show(e.name==='AbortError'?'Chưa chọn được thư mục; có thể do hủy thao tác hoặc hạn chế quyền/chính sách trình duyệt.':e.message,true)}}
async function readJson(name,def){let h=await root.getFileHandle(name,{create:false}).catch(e=>{if(e.name==='NotFoundError')return null;throw e});if(!h)return def;let file=await h.getFile();let t=await file.text();let v=JSON.parse(t);if(v.schemaVersion!==SCHEMA||!Array.isArray(v.items))throw Error('Cấu trúc dữ liệu '+name+' không tương thích');return v.items}
async function verifyWrite(){let h=await root.getFileHandle('.min-exam-permission-test.tmp',{create:true});let w=await h.createWritable();await w.write('test:'+now());await w.close();let t=await(await h.getFile()).text();if(!t.startsWith('test:'))throw Error('Không đọc lại được file kiểm tra');await root.removeEntry('.min-exam-permission-test.tmp')}
async function connect(init=false){if(!root)return;try{let permission=await root.queryPermission({mode:'readwrite'});if(permission!=='granted'){if(!init){ready=false;updateStatus();render();return}permission=await root.requestPermission({mode:'readwrite'})}if(permission!=='granted')throw Error('Chưa được cấp quyền đọc/ghi thư mục');let loaded={};for(const k of Object.keys(data))loaded[k]=await readJson(k+'.json',[]);await verifyWrite();data=loaded;ready=true;await restoreExamDraft();updateStatus();render();show('Đã kiểm tra quyền đọc, ghi và dữ liệu thành công')}catch(e){ready=false;updateStatus();render();show('Kết nối chưa sẵn sàng: '+e.message,true)}}
async function requestReconnect(){if(!root)return pickDir();try{let p=await root.requestPermission({mode:'readwrite'});if(p==='granted')await connect(true);else show('Bạn chưa cấp quyền truy cập thư mục.',true)}catch(e){show('Không thể cấp lại quyền: '+e.message,true)}}
function filename(k){return k+'.json'}async function writeFile(name,content){let h=await root.getFileHandle(name,{create:true});let w=await h.createWritable();try{await w.write(content);await w.close()}catch(e){try{await w.abort()}catch(_){}throw e}}
async function saveKind(k,next){if(!requireReady())return false;if(saveBusy){show('Đang lưu thao tác trước.',true);return false}saveBusy=true;let source=data[k];try{if(!Array.isArray(next))throw Error('Dữ liệu không hợp lệ');let previous=await readJson(filename(k),[]);if(JSON.stringify(previous)!==JSON.stringify(source))throw Error('Kho dữ liệu đã thay đổi ngoài ứng dụng. Hãy tải lại trước khi ghi.');let backupDir=await root.getDirectoryHandle('BACKUP',{create:true});let fileText=JSON.stringify({schemaVersion:SCHEMA,updatedAt:now(),items:previous},null,2);await (async()=>{let h=await backupDir.getFileHandle(`${k}-${Date.now()}.json`,{create:true});let w=await h.createWritable();await w.write(fileText);await w.close()})();await writeFile(filename(k),JSON.stringify({schemaVersion:SCHEMA,updatedAt:now(),items:next},null,2));let verified=await readJson(filename(k),[]);if(JSON.stringify(verified)!==JSON.stringify(next))throw Error('Đối soát dữ liệu sau khi ghi không khớp');data[k]=next;show('Đã lưu và đọc lại kiểm tra thành công');render();return true}catch(e){show('Lưu thất bại: '+e.message+'; dữ liệu đang nhập vẫn được giữ trên màn hình khi có thể.',true);return false}finally{saveBusy=false}}
function card(title,body){return `<section class="panel"><h2>${title}</h2>${body}</section>`}function empty(s){return `<div class="empty">${esc(s)}</div>`}function subj(q){return data.topics.find(t=>t.id===q.topicId)?.name||q.topicName||'Chưa phân loại'}function validQ(){return data.questions.filter(q=>q.status==='active'&&data.topics.some(t=>t.id===q.topicId&&t.active!==false)&&Array.isArray(q.options)&&q.options.length>=2&&q.options.length<=7&&Array.isArray(q.correct)&&q.correct.length>0)}
function render(){updateStatus();let screen=$('#screen');let f={home:homePage,storage:storagePage,topics:topicsPage,questions:questionsPage,setup:setupPage,exam:examPage,study:studyPage,review:reviewPage,results:resultsPage,detail:detailPage,help:helpPage}[page]||homePage;screen.innerHTML=(working&&page!=='exam'?activeExamBanner():'')+f();bindPage();updateResumeControl()}
function activeExamBanner(){return `<div class="active-exam-banner" role="status"><div><strong>⏳ Bài thi đang làm: ${esc(working.name)}</strong><div class="small">${Object.keys(working.answers).length}/${working.qs.length} câu đã trả lời · Thời gian vẫn tiếp tục tính nếu có giới hạn. Bài được lưu nháp tự động trên trình duyệt này.</div></div><div class="actions"><button class="primary" onclick="go('exam')">↩ Quay lại bài thi</button><button class="danger" onclick="abandonExam()">Hủy bài thi</button></div></div>`}
function updateResumeControl(){const b=$('#resumeExamBtn');if(b){b.classList.toggle('hide',!working);b.textContent=working?'↩ Tiếp tục bài thi':''}}
function abandonExam(){if(!working)return;grabAnswer();if(!confirm('HỦY BÀI THI ĐANG LÀM?\n\nToàn bộ câu trả lời chưa nộp sẽ bị xóa. Thao tác này không thể hoàn tác.\n\nChọn Hủy nếu muốn giữ bài và tiếp tục sau.'))return;working=null;clearExamDraft();go('setup');show('Đã hủy bài thi theo xác nhận của bạn.');}
function draftForStorage(){if(!working)return null;return {version:1,rootName:root?.name||'',updatedAt:now(),working:{...working,submitting:false}}}
function writeDraft(){if(!working)return;const draft=draftForStorage();try{localStorage.setItem(DRAFT_KEY,JSON.stringify(draft))}catch(e){/* IndexedDB remains primary if browser storage quota is exceeded */}if(db){let seq=++draftWriteSeq;idbSet(DRAFT_KEY,draft).catch(e=>console.warn('Không thể lưu nháp IndexedDB:',e))}}
function clearExamDraft(){++draftWriteSeq;try{localStorage.removeItem(DRAFT_KEY)}catch(e){}if(db)idbSet(DRAFT_KEY,null).catch(e=>console.warn('Không thể xóa nháp:',e))}

if(data.attempts.some(a=>a.id===w.id)){clearExamDraft();return}working={...w,submitting:false};page='exam';show('Đã khôi phục bài thi đang làm. Bạn có thể tiếp tục từ câu đã dừng.');}

function questionsPage(){if(!ready)return noData();let search=(typeof window.qSearch==='string'?window.qSearch:'').toLowerCase(),filter=(typeof window.qFilter==='string'?window.qFilter:''),qs=data.questions.filter(q=>(!filter||q.topicId===filter)&&(!search||(q.text+' '+subj(q)+' '+q.id).toLowerCase().includes(search)));return `<h1>Ngân hàng câu hỏi</h1><p>Nhập trực tiếp Excel .xlsx hoặc thêm từng câu thủ công. Cột CHỦ ĐỀ có trong file mẫu, app tự tạo mã cho từng câu. <b>Mỗi dòng = 1 câu hỏi, nhiều dòng = nhiều câu</b>; nhập toàn bộ câu hỏi trong một file Excel .xlsx. Mỗi câu có từ 2 phương án A–B trở lên (mẫu hỗ trợ đến G); mặc định hiển thị 4 ô.</p>${card('Thao tác dữ liệu',`<div class="actions"><button class="primary" onclick="openQuestionForm()">+ Thêm câu hỏi</button><button onclick="downloadQuestionsXLSX()">Tải mẫu Excel .xlsx</button><button class="primary" onclick="chooseImport('questions')">Nhập Excel .xlsx</button><button onclick="exportQuestionsXLSX()">Xuất danh sách Excel</button></div><p class="note"><b>Không cần nhập từng câu:</b> tải mẫu Excel, mở sheet <b>CAU_HOI</b>, điền các dòng liên tiếp rồi lưu file .xlsx và chọn <b>Nhập Excel .xlsx</b>. Không cần nhập mã, không cần chuyển CSV, không cần dán từng câu. Chủ đề mới sẽ được tạo khi nhập nếu chưa có.</p>`)}<div id="questionEditor"></div>${card('Danh sách câu hỏi ('+qs.length+')',`<div class="two"><input id="qSearch" value="${esc((typeof window.qSearch==='string'?window.qSearch:''))}" placeholder="Tìm câu hỏi/mã..."><select id="qFilter"><option value="">Tất cả chủ đề</option>${data.topics.map(t=>`<option ${filter===t.id?'selected':''} value="${t.id}">${esc(t.name)}</option>`).join('')}</select></div><div class="tablewrap" style="margin-top:12px"><table><thead><tr><th>Mã</th><th>Chủ đề</th><th>Câu hỏi</th><th>Loại</th><th>Trạng thái</th><th>Thao tác</th></tr></thead><tbody>${qs.map(q=>`<tr><td>${esc(q.code||q.id.slice(0,8))}</td><td>${esc(subj(q))}</td><td>${esc(q.text.slice(0,180))}</td><td>${q.multipl function openQuestionForm(id=null){if(!requireReady())return;editId=id;go('questions');let q=id?data.questions.find(x=>x.id===id):null;const options=[...Array.from({length:Math.max(2,Math.min(7,q?.options?.length||4))},(_,i)=>q?.options?.[i]||'')];$('#questionEditor').innerHTML=card(id?'Chỉnh sửa câu hỏi':'Thêm câu hỏi mới',`<form id="questionForm"><div class="field"><label>CHỦ ĐỀ *</label><select name="topicId" required><option value="">Chọn chủ đề</option>${data.topics.filter(t=>t.active!==false||t.id===q?.topicId).map(t=>`<option value="${t.id}" ${q?.topicId===t.id?'selected':''}>${esc(t.name)}</option>`).join('')}</select></div><div class="field"><label>Nội dung câu hỏi *</label><textarea name="text" required>${esc(q?.text||'')}</textarea></div><div class="two"><div class="field"><label>Loại câu hỏi</label><select name="multiple"><option value="0" ${!q?.multiple?'selected':''}>Một đáp án</option><option value="1" ${q?.multiple?'selected':''}>Nhiều đáp án đúng</option></select></div></div><div class="field"><label>Số phương án trả lời (từ 2)</label><select id="optionCount" name="optionCount" onchange="updateOptionFields()">${[2,3,4,5,6,7].map(n=>`<option value="${n}" ${n===options.length?'selected':''}>${n} phương án</option>`).join('')}</select></div><div id="optionFields">${options.map((o,i)=>`<div class="field"><label>Đáp án ${'ABCDEFG'[i]} *</label><input name="opt${i}" value="${esc(o)}" required></div>`).join('')}</div><div class="field"><label>Đáp án đúng (A hoặc A,C đối với nhiều đáp án) *</label><input name="correct" value="${esc((q?.correct||[]).map(i=>'ABCDEFGH'[i]).join(','))}" required></div><div class="field"><label>Giải thích / căn cứ</label><textarea name="explain">${esc(q?.explain||'')}</textarea></div><div class="actions"><button type="submit" class="primary">Lưu câu hỏi</button><button type="button" onclick="editId=null;go('questions')">Hủy</button></div></form>`);$('#questionForm').onsubmit=saveQuestion;$('#questionEditor').scrollIntoView({behavior:'smooth',block:'start'})}
function updateOptionFields(){let f=$('#questionForm'), count=Number($('#optionCount')?.value||4), container=$('#optionFields');if(!f||!container)return;let previous=Array.from({length:7},(_,i)=>f.elements.namedItem('opt'+i)?.value||'');container.innerHTML=Array.from({length:count},(_,i)=>`<div class="field"><label>Đáp án ${'ABCDEFG'[i]} *</label><input name="opt${i}" value="${esc(previous[i])}" required></div>`).join('')}
async function saveQuestion(e){e.preventDefault();let f=new FormData(e.target),optionCount=Number(f.get('optionCount')),opts=Array.from({length:optionCount},(_,i)=>String(f.get('opt'+i)||'').trim());let answer=String(f.get('correct')||'').toUpperCase().split(/[;,\s]+/).filter(Boolean);let correct=[...new Set(answer.map(x=>'ABCDEFG'.indexOf(x)))];if(opts.length<2||opts.length>7||opts.some(x=>!x)||correct.some(i=>i<0||i>=opts.length)||!correct.length){show('Vui lòng nhập đủ phương án và đáp án đúng hợp lệ.',true);return}let multiple=f.get('multiple')==='1';if(!multiple&&correct.length!==1){show('Câu một đáp án chỉ được có một phương án đúng.',true);return}let old=editId?data.questions.find(x=>x.id===editId):null;let code=old?.code||uid().replace(/-/g,'').slice(0,16).toUpperCase();if(data.questions.some(x=>x.id!==old?.id&&x.code.toLowerCase()===code.toLowerCase())){show('Mã nội bộ bị trùng, vui lòng thử lại.',true);return}let q={...(old||{}),id:old?.id||uid(),code,topicId:String(f.get('topicId')),text:String(f.get('text')).trim(),options:opts,correct,multiple,explain:String(f.get('explain')).trim(),status:old?.status||'active',revision:(old?.revision||0)+1,updatedAt:now()};if(!q.text||!data.topics.some(t=>t.id===q.topicId)){show('Thiếu nội dung hoặc chủ đề hợp lệ.',true);return}if(await saveKind('questions',old?data.questions.map(x=>x.id===old.id?q:x):[...data.questions,q])){editId=null;go('questions')}}
async function toggleQuestion(id){let q=data.questions.find(x=>x.id===id);if(!q||!confirm('Xác nhận thay đổi trạng thái sử dụng của câu hỏi?'))return;await saveKind('questions',data.questions.map(x=>x.id===id?{...x,status:x.status==='active'?'inactive':'active',revision:x.revision+1,updatedAt:now()}:x))}
function editTopic(id){let t=data.topics.find(x=>x.id===id);if(!t)return;window.editTopicId=id;let f=$('#topicForm');f.elements.name.value=t.name;f.scrollIntoView({behavior:'smooth'})}function resetTopic(){window.editTopicId=null;$('#topicForm')?.reset()}async function toggleTopic(id){let t=data.topics.find(x=>x.id===id);if(!t||!confirm('Xác nhận đổi trạng thái chủ đề?'))return;await saveKind('topics',data.topics.map(x=>x.id===id?{...x,active:x.active===false,updatedAt:now()}:x))}
function studyPage(){if(!ready)return noData();return `<h1>Luyện tập · Xem đáp án ngay</h1>${card('Chọn nội dung luyện tập',`<div class="two"><div class="field"><label>Chủ đề</label><select id="studyTopic"><option value="">Tất cả chủ đề</option>${data.topics.filter(t=>t.active!==false).map(t=>`<option value="${t.id}">${esc(t.name)}</option>`).join('')}</select></div><div class="field"><label>Số câu tối đa</label><input type="number" id="studyCount" min="1" value="20"></div></div><button class="primary" onclick="startStudy()" ${validQ().length?'':'disabled'}>Bắt đầu học</button>`)}<div id="studyArea"></div>`}
function startStudy(){let t=$('#studyTopic').value,count=Math.max(1,Math.floor(num($('#studyCount').value)||20)),pool=validQ().filter(q=>!t||q.topicId===t);if(!pool.length){show('Chủ đề chưa có câu hỏi hợp lệ.',true);return}study={qs:shuffle(pool).slice(0,count),index:0,answered:{}};renderStudy()}
function renderStudy(){if(!study)return;let q=study.qs[study.index],checked=study.answered[q.id];$('#studyArea').innerHTML=card(`Câu ${study.index+1}/${study.qs.length} · ${esc(subj(q))}`,`<p class="lead">${esc(q.text)}</p>${q.options.map((opt,i)=>`<label class="option"><input type="${q.multiple?'checkbox':'radio'}" name="studyAnswer" value="${i}" ${checked?.selected.includes(i)?'checked':''} ${checked?'disabled':''}><span><b>${'ABCDEFGH'[i]}.</b> ${esc(opt)}</span></label>`).join('')}<div class="actions">${checked?`<div class="notice ${checked.good?'good':'error'}">${checked.good?'Chính xác!':'Chưa chính xác.'} Đáp án: ${q.correct.map(i=>'ABCDEFGH'[i]).join(', ')}<br>${esc(q.explain||'Chưa có giải thích.')}</div>`:'<button class="primary" onclick="checkStudy()">Kiểm tra đáp án</button>'}<button onclick="nextStudy()">${study.index===study.qs.length-1?'Kết thúc':'Câu tiếp theo'}</button></div>`)}
function checkStudy(){let q=study.qs[study.index],sel=[...document.querySelectorAll('[name=studyAnswer]:checked')].map(x=>+x.value).sort((a,b)=>a-b);if(!sel.length){show('Hãy chọn một đáp án.',true);return}let good=JSON.stringify(sel)===JSON.stringify([...q.correct].sort((a,b)=>a-b));study.answered[q.id]={selected:sel,good};renderStudy()}
function nextStudy(){if(study.index+1>=study.qs.length){let good=Object.values(study.answered).filter(x=>x.good).length;show(`Kết thúc luyện tập: đúng ${good}/${study.qs.length} câu. Lưu lịch sử chính thức sử dụng chế độ Thi thử.`);study=null;go('study')}else{study.index++;renderStudy()}}

function countOptions(def=20){return `<label>Số câu</label><select id="simpleCount">${[10,20,30,50,100].map(x=>`<option value="${x}" ${x===def?'selected':''}>${x} câu</option>`).join('')}<option value="custom">Số khác…</option></select><input id="customCount" type="number" min="1" placeholder="Nhập số câu khác" class="hide" style="margin-top:8px" oninput="this.value=this.value.replace(/[^0-9]/g,'')"><p class="small muted">Nếu kho câu ít hơn số chọn, app sẽ lấy số câu thực có và thông báo.</p>`}
function commonTime(defaultVal=30){return `<div class="field"><label>Thời gian (phút, nhập 0 để không giới hạn)</label><input id="simpleMinutes" type="number" min="0" value="${defaultVal}"></div>`}
function examModeConfig(){let pool=validQ();let mode=examMode;
 if(mode==='random')return card('Thi ngẫu nhiên · Thiết lập nhanh',`<div class="two"><div class="field">${countOptions()}</div>${commonTime()}</div><button class="primary" onclick="launchSimpleExam()">Bắt đầu thi →</button>`);
 if(mode==='topics')return card('Thi theo chủ đề · Không cần phân bổ',`<p>Chọn một hoặc nhiều chủ đề. App lấy ngẫu nhiên từ tất cả chủ đề đã chọn.</p><div class="topic-checks">${activeTopicOptions().map(t=>`<label class="check-row"><input type="checkbox" name="pickTopic" value="${t.id}" checked><span>${esc(t.name)} <small>(${pool.filter(q=>q.topicId===t.id).length} câu)</small></span></label>`).join('')||empty('Chưa có chủ đề với câu hỏi hợp lệ.')}</div><div class="two"><div class="field">${countOptions()}</div>${commonTime()}</div><button class="primary" onclick="launchSimpleExam()">Bắt đầu thi →</button>`);
 if(mode==='wrong'||mode==='marked'){let ids=mode==='wrong'?wrongQuestionIds():new Set(data.questions.filter(q=>q.bookmarked).map(q=>q.id));let n=pool.filter(q=>ids.has(q.id)).length;return card(mode==='wrong'?'Thi lại các câu đã sai':'Thi các câu đã đánh dấu',`<p>Hiện có <b>${n}</b> câu có thể sử dụng trong chế độ này.</p><div class="two"><div class="field">${countOptions()}</div>${commonTime(0)}</div><button class="primary" onclick="launchSimpleExam()" ${n?'':'disabled'}>Bắt đầu →</button>${!n?`<p class="note">${mode==='wrong'?'Hãy hoàn thành bài thi để có lịch sử câu sai.':'Đánh dấu câu trong khi học hoặc xem kết quả trước.'}</p>`:''}`)}
 if(mode==='mock')return card('Thi mô phỏng kỳ thi thật',`<p>Không hiển thị đáp án trong khi thi. Hết thời gian sẽ tự nộp bài.</p><div class="two"><div class="field">${countOptions(50)}</div>${commonTime(45).replace('nhập 0 để không giới hạn','bắt buộc có thời gian')}</div><button class="primary" onclick="launchSimpleExam()">Bắt đầu thi mô phỏng →</button>`);
 if(mode==='saved')return card('Chọn một mẫu đề đã lưu',data.templates.length?`<div class="field"><label>Mẫu đề</label><select id="savedExamId">${data.templates.map(t=>`<option value="${t.id}">${esc(t.name)} ${t.fixedQuestionIds?'· đề cố định':'· cơ cấu tùy chỉnh'}</option>`).join('')}</select></div><p class="small muted">Mẫu cơ cấu sẽ tạo câu hỏi ngẫu nhiên theo số lượng/tỷ lệ đã lưu. Mẫu đề cố định dùng lại đúng danh sách câu hỏi của lần thi.</p><button class="primary" onclick="startSavedExam()">Thi theo mẫu này →</button>`:`<p>Chưa có mẫu đề. Có thể lưu từ mục <b>Tùy chỉnh nâng cao</b> hoặc lưu một đề cố định từ màn kết quả thi.</p><button onclick="selectExamMode('advanced')">Tạo cấu trúc đề</button>`);
 if(mode==='advanced')return `<section class="panel"><h2>Tạo đề theo cơ cấu từng chủ đề (tùy chọn)</h2><p>Chỉ cần thiết lập ở đây nếu muốn quy định số câu hoặc tỷ lệ của từng chủ đề.</p><div class="three"><div class="field"><label>Tên đề thi</label><input id="examName" placeholder="Ví dụ: Kiểm tra nghiệp vụ"></div><div class="field"><label>Tổng số câu</label><input id="examTotal" type="number" min="1" value="${Math.min(50,Math.max(1,pool.length))}"></div><div class="field"><label>Thời gian (phút; 0 = không giới hạn)</label><input id="examMinutes" type="number" min="0" value="45"></div></div><div class="field"><label>Phân bổ theo</label><select id="allocMode"><option value="count">Số câu từng chủ đề</option><option value="percent">Tỷ lệ % từng chủ đề</option></select></div><div id="topicAlloc"></div><div id="allocWarning" class="notice"></div><div class="actions"><button class="primary" onclick="prepareExam()" ${pool.length?'':'disabled'}>Bắt đầu thi →</button><button onclick="saveTemplate()" ${pool.length?'':'disabled'}>Lưu cấu trúc đề</button></div></section>`;
 return '';
}
function wrongQuestionIds(){let ids=new Set();for(let a of data.attempts)for(let q of a.questions||[]){let chosen=[...(a.answers?.[q.id]||[])].sort((x,y)=>x-y),correct=[...q.correct].sort((x,y)=>x-y);if(JSON.stringify(chosen)!==JSON.stringify(correct))ids.add(q.id)}return ids}
function chosenCount(){let s=$('#simpleCount')?.value;return s==='custom'?Math.floor(num($('#customCount')?.value)):Math.floor(num(s||20))}
function startQuickExam(){let pool=validQ();if(!pool.length)return show('Chưa có câu hỏi hợp lệ. Hãy nhập Excel trước.',true);launchExam(shuffle(pool).slice(0,20),'Thi nhanh',20,'quick')}
function launchSimpleExam(){let mode=examMode,total=chosenCount(),minutes=Math.floor(num($('#simpleMinutes')?.value));if(total<1)return show('Vui lòng chọn số câu lớn hơn 0.',true);if(mode==='mock'&&minutes<1)return show('Thi mô phỏng cần thời gian lớn hơn 0 phút.',true);if(minutes<0)return show('Thời gian không hợp lệ.',true);let pool=validQ();if(mode==='topics'){let selected=[...document.querySelectorAll('[name=pickTopic]:checked')].map(e=>e.value);if(!selected.length)return show('Hãy chọn ít nhất một chủ đề.',true);pool=pool.filter(q=>selected.includes(q.topicId))}if(mode==='wrong'){let ids=wrongQuestionIds();pool=pool.filter(q=>ids.has(q.id))}if(mode==='marked')pool=pool.filter(q=>q.bookmarked);if(!pool.length)return show('Không có câu hỏi phù hợp với chế độ này.',true);if(pool.length<total)show(`Kho hiện chỉ có ${pool.length} câu; đề sẽ lấy toàn bộ số câu hiện có.`);launchExam(shuffle(pool).slice(0,total),{random:'Thi ngẫu nhiên',topics:'Thi theo chủ đề',wrong:'Thi lại câu sai',marked:'Thi câu đánh dấu',mock:'Thi mô phỏng'}[mode]||'Thi thử',minutes,mode)}
function launchExam(qs,name,minutes,mode,allocation){if(!qs.length)return show('Chưa có câu hỏi để bắt đầu.',true);if(!askBeforeNewExam())return;let copies=shuffle(qs).map(q=>({...structuredClone(q),options:structuredClone(q.options),correct:structuredClone(q.correct)}));working={id:uid(),name,qs:copies,answers:{},flags:[],index:0,minutes,startedAt:now(),deadline:minutes>0?Date.now()+minutes*60000:null,allocation:allocation||Object.fromEntries(data.topics.map(t=>[t.id,copies.filter(q=>q.topicId===t.id).length])),examMode:mode};writeDraft();go('exam')}
function startSavedExam(){let t=data.templates.find(x=>x.id===$('#savedExamId')?.value);if(!t)return show('Chưa chọn mẫu đề.',true);if(t.fixedQuestionIds){let qs=(Array.isArray(t.fixedQuestions)&&t.fixedQuestions.length?t.fixedQuestions:t.fixedQuestionIds.map(id=>validQ().find(q=>q.id===id)).filter(Boolean));if(qs.length!==t.fixedQuestionIds.length)return show('Một số câu trong đề cố định không còn khả dụng. Vui lòng kiểm tra bộ đề.',true);return launchExam(qs,t.name,Math.max(0,Math.floor(t.minutes||0)),'saved-fixed')}let total=t.total,mode=t.mode,alloc=t.alloc||{},topics=data.topics.filter(x=>x.active!==false);let map;if(mode==='count')map=Object.fromEntries(topics.map(x=>[x.id,Math.max(0,Math.floor(num(alloc[x.id])))]));else {let v=topics.map(x=>Math.max(0,Math.floor(num(alloc[x.id]))));if(v.reduce((a,b)=>a+b,0)!==100)return show('Tỷ lệ mẫu đề không hợp lệ.',true);let fractions=v.map(x=>x*total/100),base=fractions.map(Math.floor),remaining=total-base.reduce((a,b)=>a+b,0),order=fractions.map((x,i)=>({i,v:x-base[i]})).sort((a,b)=>b.v-a.v);for(let i=0;i<remaining;i++)base[order[i].i]++;map=Object.fromEntries(topics.map((x,i)=>[x.id,base[i]]))}if(Object.values(map).reduce((a,b)=>a+b,0)!==total)return show('Số câu trong mẫu không khớp tổng số câu.',true);let qs=[];for(let [id,n] of Object.entries(map)){let pool=validQ().filter(q=>q.topicId===id);if(pool.length<n)return show('Chủ đề '+(data.topics.find(t=>t.id===id)?.name||id)+' thiếu câu hỏi.',true);qs.push(...shuffle(pool).slice(0,n))}launchExam(qs,t.name,Math.max(0,Math.floor(t.minutes||0)),'saved',map)}
async function saveFixedFromResult(id){let a=data.attempts.find(x=>x.id===id);if(!a)return;let name=prompt('Đặt tên cho bộ đề cố định:',a.name+' · đề cố định');if(name===null)return;name=name.trim();if(!name)return show('Tên đề không được trống.',true);let t={id:uid(),name,minutes:a.minutes,total:a.total,fixedQuestionIds:a.questions.map(x=>x.id),fixedQuestions:structuredClone(a.questions),createdAt:now()};if(await saveKind('templates',[...data.templates,t]))show('Đã lưu đề cố định; có thể mở ở Thi theo mẫu đề.')}
async function toggleBookmark(id){if(!requireReady())return;if(page==='exam'&&working)grabAnswer();let q=data.questions.find(x=>x.id===id);if(!q){show('Câu hỏi này không còn trong ngân hàng hiện tại.',true);return}await saveKind('questions',data.questions.map(x=>x.id===id?{...x,bookmarked:!x.bookmarked}:x))}
let allocValues={};let allocationMode='count';function renderAllocation(){let total=+($('#examTotal')?.value||0),mode=$('#allocMode')?.value||'count';allocationMode=mode;let list=data.topics.filter(t=>t.active!==false);$('#topicAlloc').innerHTML=`<div class="topicrow small muted"><strong>CHỦ ĐỀ</strong><strong>Đang có</strong><strong>${mode==='count'?'SỐ CÂU':'TỶ LỆ (%)'}</strong><strong>Dự kiến</strong></div>${list.map(t=>`<div class="topicrow"><strong>${esc(t.name)}</strong><span>${validQ().filter(q=>q.topicId===t.id).length} câu</span><input type="number" min="0" data-alloc="${t.id}" value="${allocValues[t.id]??0}"><span class="computed" id="preview_${t.id}">—</span></div>`).join('')}`;document.querySelectorAll('[data-alloc]').forEach(e=>e.oninput=()=>{allocValues[e.dataset.alloc]=Math.max(0,Math.floor(num(e.value)));updateAllocation()});updateAllocation()}
function allocate(){let total=Math.floor(num($('#examTotal')?.value)),mode=$('#allocMode')?.value,topics=data.topics.filter(t=>t.active!==false),numbers=topics.map(t=>Math.max(0,Math.floor(num(allocValues[t.id])))),sum=numbers.reduce((a,b)=>a+b,0);if(total<=0)return {error:'Tổng số câu phải lớn hơn 0.'};if(mode==='count'){if(sum!==total)return {error:`Đã phân bổ ${sum}/${total} câu. Tổng phải bằng ${total}.`};return {map:Object.fromEntries(topics.map((t,i)=>[t.id,numbers[i]]))}}if(sum!==100)return {error:`Tổng tỷ lệ đang là ${sum}%. Yêu cầu đúng 100%.`};let raws=numbers.map(n=>n*total/100),base=raws.map(Math.floor),remain=total-base.reduce((a,b)=>a+b,0),order=raws.map((v,i)=>({i,f:v-base[i]})).sort((a,b)=>b.f-a.f||a.i-b.i);for(let i=0;i<remain;i++)base[order[i].i]++;return {map:Object.fromEntries(topics.map((t,i)=>[t.id,base[i]]))}}
function updateAllocation(){let a=allocate();document.querySelectorAll('.computed').forEach(x=>x.textContent=a.map?`${a.map[x.id.slice(8)]||0} câu`:'—');let warn=$('#allocWarning');if(!warn)return;let shortages=a.map?Object.entries(a.map).filter(([id,n])=>n>validQ().filter(q=>q.topicId===id).length):[];warn.className='notice'+(a.error||shortages.length?' error':' good');warn.textContent=a.error|| (shortages.length?`Không đủ câu ở: ${shortages.map(([id,n])=>data.topics.find(t=>t.id===id)?.name+` (cần ${n}, có ${validQ().filter(q=>q.topicId===id).length})`).join('; ')}`:'Cơ cấu hợp lệ. Có thể tạo đề thi.');return {a,shortages}}
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function prepareExam(){let {a,shortages}=updateAllocation();if(a.error||shortages.length){show('Cấu hình chưa hợp lệ.',true);return}let minutes=Math.floor(num($('#examMinutes').value));if(minutes<0){show('Thời gian thi không hợp lệ.',true);return}let qs=[];for(let [id,n]of Object.entries(a.map))qs.push(...shuffle(validQ().filter(q=>q.topicId===id)).slice(0,n));qs=shuffle(qs).map(q=>({...structuredClone(q),options:structuredClone(q.options),correct:structuredClone(q.correct)}));if(!qs.length){show('Không có câu hỏi trong đề.',true);return}let name=$('#examName').value.trim()||'Đề thi tùy chỉnh';launchExam(qs,name,minutes,'advanced',a.map)}
async function saveTemplate(){let {a,shortages}=updateAllocation();if(a.error||shortages.length){show('Hãy sửa phân bổ trước khi lưu mẫu.',true);return}let t={id:uid(),name:$('#examName').value.trim()||`Mẫu ${data.templates.length+1}`,total:+$('#examTotal').value,minutes:+$('#examMinutes').value,mode:$('#allocMode').value,alloc:{...allocValues},createdAt:now()};await saveKind('templates',[...data.templates,t])}function loadTemplate(){let t=data.templates.find(x=>x.id===$('#savedTemplate').value);if(!t)return show('Chưa chọn mẫu.',true);$('#examName').value=t.name;$('#examTotal').value=t.total;$('#examMinutes').value=t.minutes;$('#allocMode').value=t.mode;allocValues={...t.alloc};renderAllocation()}
function retryAttempt(id){let a=data.attempts.find(x=>x.id===id);if(!a)return;launchExam(a.questions,a.name+' · thi lại',a.minutes||0,'retry')}function reviewWrongAttempt(id){let a=data.attempts.find(x=>x.id===id);if(!a)return;let qs=a.questions.filter(q=>JSON.stringify([...(a.answers[q.id]||[])].sort((x,y)=>x-y))!==JSON.stringify([...q.correct].sort((x,y)=>x-y)));if(!qs.length)return show('Bài này không có câu trả lời sai.',true);launchExam(qs,'Ôn câu sai · '+a.name,0,'review-wrong')}
function examPage(){if(!working)return card('Chưa có đề đang làm',`<button onclick="go('setup')">Tạo đề mới</button>`);let w=working,q=w.qs[w.index],answer=w.answers[q.id]||[];return `<div class="split"><div><h1>${esc(w.name)}</h1><p>Câu ${w.index+1}/${w.qs.length} · ${esc(subj(q))}</p></div><div><b id="clock">--:--</b><p class="small">${w.deadline?'Thời gian còn lại':'Chế độ không giới hạn thời gian'}</p></div></div><div class="exam-layout"><section class="panel"><div class="split"><h2>Câu ${w.index+1}</h2><div class="actions"><button onclick="flagExam()">${w.flags.includes(w.index)?'★ Bỏ cờ xem lại':'☆ Gắn cờ xem lại'}</button><button onclick="toggleBookmark('${q.id}')">${data.questions.some(x=>x.id===q.id&&x.bookmarked)?'★ Đã lưu ôn tập':'☆ Lưu câu để ôn'}</button></div></div><p class="lead">${esc(q.text)}</p>${q.options.map((opt,i)=>`<label class="option"><input name="examAns" type="${q.multiple?'checkbox':'radio'}" onchange="onAnswerChanged()" value="${i}" ${answer.includes(i)?'checked':''}><span><strong>${'ABCDEFGH'[i]}.</strong> ${esc(opt)}</span></label>`).join('')}<div class="actions split"><button onclick="examNav(-1)" ${w.index===0?'disabled':''}>← Câu trước</button><button class="primary" onclick="examNav(1)">${w.index===w.qs.length-1?'Xem lại câu đầu':'Câu tiếp →'}</button></div></section><aside class="panel"><h2>Điều hướng câu hỏi</h2><div class="progress"><div id="examProgress" style="width:${Object.keys(w.answers).length/w.qs.length*100}%"></div></div><p class="small" id="examAnswered">Đã trả lời ${Object.keys(w.answers).length}/${w.qs.length}</p><div class="numbergrid">${w.qs.map((x,i)=>`<button data-exam-index="${i}" class="${w.answers[x.id]?.length?'done':''} ${w.flags.includes(i)?'flag':''}" onclick="jumpExam(${i})">${i+1}</button>`).join('')}</div><p class="small muted">Nền xanh: đã trả lời. Viền vàng: đánh dấu.</p><button class="primary" style="width:100%" onclick="submitExam(false)">Nộp bài</button><p class="exam-save-indicator">✓ Tự động lưu câu trả lời vào bản nháp trên trình duyệt này. Có thể đổi tab rồi quay lại.</p><button class="danger" onclick="abandonExam()">Hủy bài thi (có xác nhận)</button><p class="note">Thời gian thi tiếp tục tính khi chuyển tab. Bài chỉ thành kết quả chính thức sau khi nộp và ghi thành công vào thư mục dữ liệu. Không xóa dữ liệu trình duyệt khi còn bài chưa nộp.</p></aside></div>`}
function grabAnswer(){if(!working||page!=='exam'||!document.querySelector('[name=examAns]'))return;let q=working.qs[working.index],a=[...document.querySelectorAll('[name=examAns]:checked')].map(x=>+x.value).sort((a,b)=>a-b);if(a.length)working.answers[q.id]=a;else delete working.answers[q.id]};function examNav(d){grabAnswer();writeDraft();working.index=(working.index+d+working.qs.length)%working.qs.length;render()}function jumpExam(i){grabAnswer();writeDraft();working.index=i;render()}function flagExam(){let i=working.index;working.flags=working.flags.includes(i)?working.flags.filter(x=>x!==i):[...working.flags,i];writeDraft();render()}
async function submitExam(auto=false){if(!working||working.submitting)return;grabAnswer();let w=working,remaining=w.qs.length-Object.keys(w.answers).length;if(!auto&&!confirm(`Nộp bài? Còn ${remaining} câu chưa trả lời.`))return;writeDraft();let score=w.qs.reduce((s,q)=>{let chosen=w.answers[q.id]||[];return s+(JSON.stringify(chosen)===JSON.stringify([...q.correct].sort((a,b)=>a-b))?1:0)},0);w.submitting=true;let result={id:w.id,name:w.name,startedAt:w.startedAt,finishedAt:now(),minutes:w.minutes,total:w.qs.length,score,allocation:w.allocation,questions:w.qs,answers:w.answers,autoSubmitted:auto,examMode:w.examMode};if(await saveKind('attempts',[...data.attempts,result])){working=null;clearExamDraft();window.selectedResult=result.id;go('detail')}else{w.submitting=false;writeDraft();show('Chưa ghi kết quả thành công. Bài đang làm vẫn còn, hãy kiểm tra kết nối rồi thử nộp lại.',true)}}
function attemptTable(arr){return `<div class="tablewrap"><table><thead><tr><th>Bài thi</th><th>Ngày</th><th>Số câu</th><th>Đúng</th><th>Tỷ lệ</th><th>Xem</th></tr></thead><tbody>${arr.map(a=>`<tr><td>${esc(a.name)}</td><td>${formatDate(a.finishedAt)}</td><td>${a.total}</td><td>${a.score}</td><td>${a.total?Math.round(a.score/a.total*100):0}%</td><td><button onclick="window.selectedResult='${a.id}';go('detail')">Chi tiết</button></td></tr>`).join('')}</tbody></table></div>`}
function resultsPage(){if(!ready)return noData();let aa=[...data.attempts].reverse();let groups={};for(let a of aa)for(let q of a.questions){let id=q.topicId;groups[id]??={name:subj(q),total:0,correct:0};groups[id].total++;if(JSON.stringify((a.answers[q.id]||[]).slice().sort((x,y)=>x-y))===JSON.stringify([...q.correct].sort((x,y)=>x-y)))groups[id].correct++}return `<h1>Kết quả & lịch sử</h1><div class="grid"><div class="stat"><span>Số bài thi</span><b>${aa.length}</b></div><div class="stat"><span>Đúng trung bình</span><b>${aa.length?Math.round(aa.reduce((s,a)=>s+a.score/a.total*100,0)/aa.length)+'%':'—'}</b></div><div class="stat"><span>Câu đã làm</span><b>${aa.reduce((s,a)=>s+a.total,0)}</b></div><div class="stat"><span>Điểm cao nhất</span><b>${aa.length?Math.max(...aa.map(a=>Math.round(a.score/a.total*100)))+'%':'—'}</b></div></div><div style="height:16px"></div>${card('Kết quả theo CHỦ ĐỀ',Object.keys(groups).length?`<div class="tablewrap"><table><thead><tr><th>Chủ đề</th><th>Tổng lượt câu</th><th>Đúng</th><th>Tỷ lệ</th></tr></thead><tbody>${Object.values(groups).map(g=>`<tr><td>${esc(g.name)}</td><td>${g.total}</td><td>${g.correct}</td><td>${Math.round(g.correct/g.total*100)}%</td></tr>`).join('')}</tbody></table></div>`:empty('Chưa có dữ liệu thống kê.'))}${card('Lịch sử thi',aa.length?attemptTable(aa):empty('Chưa có bài thi nào.'))}`}
function detailPage(){let a=data.attempts.find(x=>x.id===window.selectedResult);if(!a)return noData();return `<div class="split"><h1>Kết quả: ${esc(a.name)}</h1><div class="actions"><button onclick="go('results')">← Lịch sử</button><button onclick="saveFixedFromResult('${a.id}')">Lưu thành đề cố định</button><button class="primary" onclick="go('setup')">Làm bài khác</button><button onclick="retryAttempt('${a.id}')">Thi lại đề này</button><button onclick="reviewWrongAttempt('${a.id}')">Ôn câu vừa sai</button></div></div><div class="grid"><div class="stat"><span>Số câu</span><b>${a.total}</b></div><div class="stat"><span>Số câu đúng</span><b>${a.score}</b></div><div class="stat"><span>Tỷ lệ đúng</span><b>${Math.round(a.score/a.total*100)}%</b></div><div class="stat"><span>Ngày hoàn thành</span><b style="font-size:14px">${formatDate(a.finishedAt)}</b></div></div><div style="height:16px"></div>${a.questions.map((q,i)=>{let chosen=(a.answers[q.id]||[]).slice().sort((x,y)=>x-y),correct=[...q.correct].sort((x,y)=>x-y),good=JSON.stringify(chosen)===JSON.stringify(correct);return card(`Câu ${i+1} · ${esc(subj(q))} · <span style="color:${good?'var(--ok)':'var(--bad)'}">${good?'Đúng':'Sai/chưa làm'}</span>`,`<p class="lead">${esc(q.text)}</p><div>${q.options.map((x,j)=>`<div style="padding:5px 0">${'ABCDEFGH'[j]}. ${esc(x)} ${correct.includes(j)?'✓ Đáp án đúng':''} ${chosen.includes(j)?'· Bạn đã chọn':''}</div>`).join('')}</div><div class="notice">Giải thích: ${esc(q.explain||'Chưa có giải thích.')}</div><button onclick="toggleBookmark('${q.id}')">${data.questions.some(x=>x.id===q.id&&x.bookmarked)?'★ Bỏ lưu câu ôn tập':'☆ Lưu câu để ôn tập'}</button>`)}).join('')}`}
function reviewPage(){if(!ready)return noData();let misses=new Map();for(let a of data.attempts)for(let q of a.questions){let chosen=(a.answers[q.id]||[]).slice().sort((x,y)=>x-y),correct=[...q.correct].sort((x,y)=>x-y);if(JSON.stringify(chosen)!==JSON.stringify(correct))misses.set(q.id,q)}return `<h1>Ôn tập của tôi</h1><p>Các câu từng trả lời sai và các câu đã đánh dấu để ôn lại.</p><div class="actions"><button class="primary" onclick="examMode='wrong';go('setup')">Thi lại câu sai</button><button onclick="examMode='marked';go('setup')">Thi câu đánh dấu</button></div>${card('Đã đánh dấu để ôn',data.questions.filter(q=>q.bookmarked).length?data.questions.filter(q=>q.bookmarked).map(q=>`<div style="margin:8px 0">☆ ${esc(subj(q))} · ${esc(q.text.slice(0,130))} <button onclick="toggleBookmark('${q.id}')">Bỏ đánh dấu</button></div>`).join(''):empty('Chưa có câu nào được đánh dấu.'))}${[...misses.values()].length?[...misses.values()].map((q,i)=>card(`Câu ${i+1} · ${esc(subj(q))}`,`<p class="lead">${esc(q.text)}</p>${q.options.map((x,j)=>`<div>${'ABCDEFGH'[j]}. ${esc(x)} ${q.correct.includes(j)?'✓':''}</div>`).join('')}<div class="notice">Đáp án: ${q.correct.map(j=>'ABCDEFGH'[j]).join(', ')}<br>${esc(q.explain||'Chưa có giải thích')}</div>`)).join(''):card('Chưa có câu sai',empty('Các câu trả lời sai trong bài thi sẽ xuất hiện ở đây.'))}`}

function helpPage(){return `<h1>Hướng dẫn sử dụng Bank Exam</h1><p>Hướng dẫn từ lần mở đầu tiên đến khi hoàn thành bài thi, dành cho người mới. Phiên bản 1.7 · Hoạt động offline trên Edge/Chrome có hỗ trợ chọn thư mục.</p>
<div class="notice"><strong>Bắt đầu nhanh:</strong> Kết nối thư mục → Tải mẫu Excel → Nhập toàn bộ câu hỏi → Xác nhận → Học hoặc tạo đề thi → Xem kết quả. Chủ đề được tạo tự động khi nhập. <strong>Không cần Internet</strong> sau khi đã có file HTML.</div>
<div class="help-index"><a href="#help-first">1. Bắt đầu</a><a href="#help-topic">2. Chủ đề</a><a href="#help-question">3. Câu hỏi</a><a href="#help-study">4. Học tập</a><a href="#help-exam">5. Thi thử</a><a href="#help-results">6. Kết quả</a><a href="#help-backup">7. Sao lưu</a><a href="#help-faq">8. Hỏi đáp</a></div>
<section class="panel help-section" id="help-first"><h2>1. Mở ứng dụng và kết nối thư mục</h2>
<div class="help-step"><span class="help-number">1</span><div class="help-body"><strong>Mở ứng dụng</strong><p>Mở file <code>Bank_Exam_MIN_AI_V1_7.html</code> bằng Microsoft Edge hoặc Google Chrome. Không cần cài phần mềm hay đăng nhập.</p></div></div>
<div class="help-step"><span class="help-number">2</span><div class="help-body"><strong>Chọn thư mục dữ liệu</strong><p>Nhấn <b>Kết nối thư mục</b> trên thanh đầu trang, hoặc vào <b>Nguồn dữ liệu & sao lưu</b> rồi chọn thư mục riêng để lưu câu hỏi, chủ đề, mẫu đề và lịch sử thi. Nên tạo một thư mục riêng có quyền đọc/ghi.</p></div></div>
<div class="help-step"><span class="help-number">3</span><div class="help-body"><strong>Kiểm tra trạng thái</strong><p>Quan sát nhãn ở góc trên. Khi app thông báo đã kết nối mới bắt đầu thêm dữ liệu. Nếu trình duyệt yêu cầu quyền lại sau khi mở lại, vào mục Nguồn dữ liệu để cấp lại quyền hoặc chọn lại đúng thư mục cũ.</p></div></div>
<div class="help-tip warning"><strong>Quan trọng:</strong> Dữ liệu chính nằm trong thư mục đã chọn, không nằm trong chính file HTML. Đừng xóa thư mục này. Thay đổi sang thư mục khác không tự động chuyển dữ liệu cũ.</div>
<div class="help-actions"><button onclick="go('storage')">Mở Nguồn dữ liệu</button></div></section>
<section class="panel help-section" id="help-topic"><h2>2. Tạo và quản lý CHỦ ĐỀ</h2><p>Chủ đề là cơ sở để lọc câu hỏi, luyện tập và phân bổ câu trong đề thi.</p>
<div class="help-step"><span class="help-number">1</span><div class="help-body"><strong>Vào Danh mục chủ đề</strong><p>Nhập tên chủ đề rồi lưu; không cần tự đặt mã. Hoặc bỏ qua bước này: khi nhập Excel câu hỏi, app tự tạo những chủ đề chưa có. Ví dụ minh họa: Tín dụng, Huy động vốn, Kế toán.</p></div></div>
<div class="help-step"><span class="help-number">2</span><div class="help-body"><strong>Nhập nhiều chủ đề</strong><p>Chọn <b>Tải mẫu Excel chủ đề</b>, điền đúng cấu trúc mẫu và sử dụng nút <b>Nhập Excel chủ đề</b> tại trang chủ đề. Xem trước số dòng hợp lệ/lỗi rồi xác nhận.</p></div></div>
<div class="help-step"><span class="help-number">3</span><div class="help-body"><strong>Sửa hoặc ngừng sử dụng</strong><p>Tra cứu danh sách, sửa thông tin hoặc ngừng sử dụng chủ đề. Câu hỏi thuộc chủ đề ngừng dùng sẽ không được lấy vào bài mới.</p></div></div>
<div class="help-actions"><button onclick="go('topics')">Mở Danh mục chủ đề</button></div></section>
<section class="panel help-section" id="help-question"><h2>3. Nhập ngân hàng câu hỏi — một lần nhập nhiều câu</h2><div class="notice good"><b>Không phải mỗi câu một file!</b> Một hàng dữ liệu = một câu hỏi. Dòng 1 là tên cột; dòng 2 là câu thứ nhất; dòng 3 là câu thứ hai... Bạn có thể nhập hàng trăm câu trong một lần. Trong Ngân hàng câu hỏi có nút <b>Tải mẫu Excel .xlsx</b>, <b>Nhập Excel .xlsx</b>, <b>Xuất danh sách Excel</b>.</div><div class="help-tip"><b>Nhập bằng cách dán trực tiếp từ Excel (dễ nhất):</b> (1) Tải mẫu Excel .xlsx; (2) mở trong Excel, nhập các câu ở nhiều dòng; (3) chọn cả bảng kể cả hàng tiêu đề rồi Ctrl+C; (4) trong app chọn Ngân hàng câu hỏi → Dán bảng từ Excel → Ctrl+V → Kiểm tra → Xác nhận. <b>Không cần lưu lại từng câu.</b></div><p>Nếu muốn nhập thủ công một câu lẻ vẫn dùng nút Thêm câu hỏi. Hãy tạo chủ đề trước khi nhập câu hỏi.</p>
<div class="two"><div><h3>Nhập thủ công</h3><ol class="help-list"><li>Vào <b>Ngân hàng câu hỏi</b>, chọn thêm câu hỏi.</li><li>Chọn CHỦ ĐỀ, nhập nội dung câu hỏi.</li><li>Chọn số phương án từ 2 đến 7 (mặc định 4), nhập liên tiếp từ A, không để trống ở giữa. Chọn đáp án đúng tương ứng.</li><li>Chọn loại một/nhiều đáp án, bổ sung giải thích nếu cần.</li><li>Kiểm tra rồi lưu. Câu hỏi hợp lệ đang sử dụng mới xuất hiện khi tạo đề.</li></ol></div>
<div><h3>Nhập Excel .xlsx hàng loạt</h3><ol class="help-list"><li>Chọn <b>Tải mẫu Excel .xlsx</b> ngay trong trang Ngân hàng câu hỏi.</li><li>Điền dữ liệu theo đúng tên cột và thứ tự của file mẫu, đặc biệt cột <b>CHU_DE</b>.</li><li>Lưu file <b>.xlsx</b>; chọn <b>Nhập Excel .xlsx</b>.</li><li>Đọc kết quả kiểm tra từng dòng, sửa lỗi nếu có.</li><li>Nhấn xác nhận để ghi các dòng hợp lệ; app bỏ qua dữ liệu trùng theo quy tắc hiện hành.</li></ol></div></div>
<div class="help-tip warning"><strong>Định dạng được hỗ trợ ở bản này:</strong> Excel .xlsx là định dạng chính. Tải mẫu Excel trong app, điền dữ liệu tại sheet CAU_HOI; sheet HUONG_DAN giải thích từng bước; sheet VI_DU chỉ minh họa và không được nhập.</div>
<div class="help-tip"><strong>Ý nghĩa các cột:</strong> Mã câu hỏi được hệ thống tự tạo, không cần nhập; <code>CHU_DE</code> = tên chủ đề (app tự thêm nếu chưa có); <code>NOI_DUNG</code> = câu hỏi; <code>A–G</code> = phương án (bắt buộc từ A–B; C–G tùy số phương án); <code>DAP_AN</code> = A/B/C/D/E/F/G hoặc A,C; <code>LOAI_CAU</code> = MOT (một đáp án), NHIEU (nhiều đáp án); <code>GIAI_THICH</code> = giải thích đáp án (có thể bỏ trống).</div><div class="help-tip"><strong>Đáp án đúng trong Excel:</strong> dùng chữ cái A–G tương ứng với phương án thực tế (từ 2 đến 7 phương án). Nếu câu nhiều đáp án, phân cách bằng dấu phẩy hoặc dấu chấm phẩy theo file mẫu. Để trống C đến G nếu câu chỉ có 2 đáp án; không bỏ trống phương án ở giữa. Có thể nhập từ 2 đến 7 phương án, bỏ trống các cột phía sau đáp án cuối cùng.</div>
<div class="help-actions"><button onclick="go('questions')">Mở Ngân hàng câu hỏi</button></div></section>
<section class="panel help-section" id="help-study"><h2>4. Học tập và ôn theo chủ đề</h2>
<div class="help-step"><span class="help-number">1</span><div class="help-body"><strong>Chọn Học & luyện tập</strong><p>Chọn chủ đề muốn học, sau đó bắt đầu luyện tập với các câu hỏi đủ điều kiện sử dụng.</p></div></div>
<div class="help-step"><span class="help-number">2</span><div class="help-body"><strong>Trả lời và kiểm tra</strong><p>Chọn phương án; với câu nhiều đáp án, chọn các phương án phù hợp. Kiểm tra đáp án và đọc lời giải nếu câu hỏi đã có giải thích.</p></div></div>
<div class="help-step"><span class="help-number">3</span><div class="help-body"><strong>Tiếp tục câu sau</strong><p>Duyệt các câu trong phiên học; số câu đúng được thống kê khi kết thúc phiên. <b>Phiên học không ghi vào lịch sử thi chính thức</b>; muốn có điểm và lịch sử, sử dụng chế độ Thi thử.</p></div></div>
<div class="help-actions"><button onclick="go('study')">Mở Học & luyện tập</button></div></section>
<section class="panel help-section" id="help-exam"><h2>5. Thi thử — 8 chế độ dễ dùng</h2><div class="notice good"><strong>Không bắt phân bổ chủ đề.</strong> Muốn thi ngay chỉ cần vào <b>Thi thử → Thi nhanh</b>. App tự lấy tối đa 20 câu và đặt 20 phút.</div><ol class="help-list"><li><b>Thi nhanh:</b> một nút bắt đầu, không cần cấu hình.</li><li><b>Thi ngẫu nhiên:</b> chọn số câu và thời gian; lấy trên toàn bộ câu hỏi.</li><li><b>Thi theo chủ đề:</b> chọn một hoặc nhiều chủ đề; không nhập tỷ lệ.</li><li><b>Thi theo mẫu đề:</b> chọn cấu trúc đề đã lưu hoặc đề cố định lưu từ màn kết quả.</li><li><b>Thi lại câu sai:</b> lấy từ lịch sử làm bài.</li><li><b>Thi câu đánh dấu:</b> lấy các câu đã lưu để ôn.</li><li><b>Thi mô phỏng:</b> làm bài có thời gian, hết giờ tự nộp.</li><li><b>Tùy chỉnh nâng cao:</b> chỉ khi muốn mới chọn số câu/tỷ lệ từng chủ đề.</li></ol><p>Trong đề có thể đánh dấu câu để quay lại và lưu câu vào sổ tay. Nếu nhập thời gian <b>0</b> ở các chế độ cho phép thì không giới hạn thời gian.</p><p><b>Thi lại đề này</b> dùng đúng nội dung câu của bài đã thi; <b>Làm bài khác</b> quay về chọn chế độ. Mục <b>Ôn câu vừa sai</b> lấy các câu sai trong bài vừa hoàn thành.</p><p class="note">Nếu ngân hàng có ít câu hơn số lượng yêu cầu ở các chế độ đơn giản, ứng dụng thông báo rồi lấy số hiện có. Chế độ cấu trúc chủ đề nâng cao vẫn yêu cầu đủ số câu theo cơ cấu.</p><div class="help-tip warning">Khi đang làm bài thi, ứng dụng khóa chuyển tab. Muốn rời màn thi phải nộp bài hoặc xác nhận hủy bài. Nếu đóng/tải lại trang, app sẽ thử khôi phục bản nháp khi kết nối lại đúng thư mục.</div><div class="help-actions"><button onclick="go('setup')">Mở Thi thử</button></div></section>
<section class="panel help-section" id="help-results"><h2>6. Xem kết quả, lịch sử và câu sai</h2><ol class="help-list"><li>Vào <b>Kết quả & lịch sử</b> để xem các lần thi đã hoàn thành và điểm số.</li><li>Mở một bài thi để xem chi tiết câu đã chọn, đáp án đúng và giải thích nếu có.</li><li>Vào <b>Sổ tay câu sai</b> để xem các câu từng trả lời sai trong bài thi đã lưu, phục vụ ôn lại.</li><li>Trang chủ hiển thị thống kê tổng quan từ dữ liệu đang có; nếu chưa thi, các chỉ số có thể để trống.</li></ol><div class="help-actions"><button onclick="go('results')">Mở Kết quả & lịch sử</button><button onclick="go('review')">Mở Sổ tay câu sai</button></div></section>
<section class="panel help-section" id="help-backup"><h2>7. Sao lưu, khôi phục và chuyển máy</h2><ol class="help-list"><li>Mở <b>Nguồn dữ liệu & sao lưu</b> để kiểm tra thư mục đang kết nối và trạng thái đọc/ghi.</li><li>Chọn <b>Xuất bản sao lưu JSON</b> để lưu bản JSON gồm chủ đề, câu hỏi, bài thi và mẫu đề. Cất file sao lưu ở nơi khác thư mục dữ liệu chính.</li><li>Khi cần khôi phục, nhấn <b>Khôi phục từ JSON</b>, chọn file sao lưu và xem trước số lượng bản ghi.</li><li><b>Khôi phục sẽ thay thế dữ liệu hiện tại.</b> Hãy sao lưu hiện trạng trước khi xác nhận.</li><li>Để chuyển máy, sao chép kho dữ liệu hoặc dùng bản sao lưu đã kiểm tra, mở cùng file HTML ở máy mới rồi chọn đúng thư mục dữ liệu.</li></ol><div class="help-tip warning">File JSON sao lưu là dữ liệu thường, không phải tệp mã hóa bảo mật. Không chia sẻ các bộ câu hỏi nội bộ ra bên ngoài khi chưa được phép.</div><div class="help-actions"><button onclick="go('storage')">Mở Nguồn dữ liệu & sao lưu</button></div></section>
<section class="panel help-section" id="help-faq"><h2>8. Câu hỏi thường gặp và xử lý lỗi</h2>
<details class="help-faq"><summary>Tại sao mở app mà không có câu hỏi nào?</summary><p>Ứng dụng bắt đầu với dữ liệu trống, không tự tạo câu hỏi mẫu. Hãy kết nối thư mục, tạo chủ đề rồi thêm câu hỏi hoặc nhập CSV; nếu đã có dữ liệu ở lần trước, kiểm tra có đang chọn đúng thư mục cũ không.</p></details>
<details class="help-faq"><summary>Vì sao không tạo được đề thi?</summary><p>Đối với đề tùy chỉnh nâng cao, kiểm tra tổng phân bổ có khớp số câu hoặc 100%, mỗi chủ đề có đủ câu hỏi hợp lệ đang sử dụng, và chủ đề chưa bị ngừng sử dụng. Cảnh báo ngay dưới bảng phân bổ sẽ chỉ ra thiếu ở đâu.</p></details>
<details class="help-faq"><summary>Excel nhập vào bị lỗi tên cột hoặc thứ tự cột?</summary><p>Hãy tải lại file mẫu từ đúng màn nhập, giữ nguyên tiêu đề và thứ tự cột, lưu file .xlsx. Phiên bản này nhập trực tiếp Excel .xlsx từ sheet CAU_HOI.</p></details>
<details class="help-faq"><summary>Tại sao câu hỏi đã nhập không xuất hiện khi thi?</summary><p>Kiểm tra câu hỏi có đáp án hợp lệ, đã ở trạng thái đang sử dụng và thuộc chủ đề đang hoạt động. Chỉ câu hỏi hợp lệ mới được tính là có thể rút vào đề.</p></details>
<details class="help-faq"><summary>Đã chọn thư mục nhưng vẫn báo chưa kết nối?</summary><p>Việc chọn thư mục không đồng nghĩa đã có quyền đọc/ghi. Có thể thiếu quyền Windows, trình duyệt từ chối/cần cấp lại quyền, thư mục không truy cập được hoặc lỗi tạo/đọc tệp. Vào Nguồn dữ liệu để kiểm tra lại; thử Edge/Chrome và thư mục có quyền hợp lệ. Không mặc định nguyên nhân là Chrome cũ.</p></details>
<details class="help-faq"><summary>Đang thi mà chuyển tab, tải lại trang hoặc đóng trình duyệt?</summary><p>Chuyển tab trong ứng dụng không hủy bài. Dùng nút <b>Tiếp tục bài thi</b> để quay lại. Bài được lưu nháp tự động trong trình duyệt hiện tại và có thể được khôi phục sau khi mở lại cùng trình duyệt và kết nối đúng thư mục. Nếu thời gian đã hết, app sẽ tự nộp sau khi khôi phục và kết nối thành công. Không xóa dữ liệu trang web/chế độ ẩn danh hoặc đổi máy khi đang có bài chưa nộp. Chỉ bài đã nộp và lưu thành công mới có trong lịch sử chính thức.</p></details>
<details class="help-faq"><summary>Sao chép file HTML cho người khác có tự chia sẻ dữ liệu không?</summary><p>Không. Mỗi người phải chọn kho dữ liệu phù hợp; sao chép file chương trình không tạo cơ chế đồng bộ. Không coi các nút/menu của HTML là lớp phân quyền bảo mật dữ liệu.</p></details>
<details class="help-faq"><summary>App có cần Internet hoặc máy chủ không?</summary><p>Không cần máy chủ hoặc CDN. File HTML chạy trực tiếp trong Edge/Chrome tương thích và truy cập các file được người dùng cho phép. Các chính sách máy cơ quan có thể hạn chế quyền truy cập thư mục nên cần thử trên máy thật.</p></details>
</section><p class="note">Hướng dẫn phù hợp các chức năng Bank Exam V1.8. Khi cập nhật tính năng hoặc định dạng nhập liệu, hướng dẫn cũng cần được cập nhật cùng phiên bản.</p>`}

function bindPage(){if(page==='topics'){let f=$('#topicForm');if(f)f.onsubmit=async e=>{e.preventDefault();let v=new FormData(f),name=String(v.get('name')).trim(),code=String(v.get('code')||'').trim(),old=data.topics.find(x=>x.id===window.editTopicId);if(!name)return;if(data.topics.some(x=>x.id!==old?.id&&(x.name.toLowerCase()===name.toLowerCase()||(code&&x.code?.toLowerCase()===code.toLowerCase())))){show('Trùng tên/mã chủ đề.',true);return}let t={...(old||{}),id:old?.id||uid(),name,code,active:old?.active??true,updatedAt:now()};if(await saveKind('topics',old?data.topics.map(x=>x.id===old.id?t:x):[...data.topics,t]))window.editTopicId=null}}if(page==='questions'){let search=$('#qSearch'),filter=$('#qFilter');if(search)search.oninput=e=>{window.qSearch=e.target.value;let pos=e.target.selectionStart;render();$('#qSearch').focus();$('#qSearch').setSelectionRange(pos,pos)};if(filter)filter.onchange=e=>{window.qFilter=e.target.value;render()}}if(page==='setup'&&examMode==='advanced'){let input=$('#examTotal'),mode=$('#allocMode');if(input)input.oninput=()=>updateAllocation();if(mode)mode.onchange=()=>{allocValues={};renderAllocation()};renderAllocation()}if(page==='setup'){let counts=$('#simpleCount');if(counts)counts.onchange=()=>{$('#customCount').classList.toggle('hide',counts.value!=='custom')}}if(page==='exam')tick();if(page==='study'&&study)renderStudy()}
function tick(){if(!working)return;if(!working.deadline){let el=$('#clock');if(el)el.textContent='Không giới hạn';return}let seconds=Math.max(0,Math.ceil((working.deadline-Date.now())/1000)),el=$('#clock');if(el)el.textContent=`${String(Math.floor(seconds/60)).padStart(2,'0')}:${String(seconds%60).padStart(2,'0')}`;if(!seconds&&!working.submitting){submitExam(true);return}}

function xmlSheet(rows,isHeader=true){const cols=Math.max(1,...rows.map(r=>r.length));let head=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetViews><sheetView workbookViewId="0">${isHeader?'<pane ySplit="1" topLeftCell="A2" activePane="bottomLeft" state="frozen"/>':''}</sheetView></sheetViews><cols>`;
for(let i=0;i<cols;i++){let w= i===0?28:i===1?64:i>=2&&i<=8?24: i===9?16:i===12?58:23;head+=`<col min="${i+1}" max="${i+1}" width="${w}" customWidth="1"/>`}
head+='</cols><sheetData>';
for(let ri=0;ri<rows.length;ri++){head+=`<row r="${ri+1}"${ri===0?' ht="28" customHeight="1"':''}>`;for(let ci=0;ci<rows[ri].length;ci++){let v=rows[ri][ci];if(v===undefined||v===null||v==='')continue;let col='',n=ci+1;while(n){n--;col=String.fromCharCode(65+(n%26))+col;n=Math.floor(n/26)}head+=`<c r="${col}${ri+1}" t="inlineStr"${ri===0&&isHeader?' s="1"':''}><is><t xml:space="preserve">${xesc(v)}</t></is></c>`}head+='</row>'}
return head+'</sheetData><autoFilter ref="A1:'+(()=>{let n=cols,s='';while(n){n--;s=String.fromCharCode(65+n%26)+s;n=Math.floor(n/26)}return s})()+'1"/></worksheet>'}
async function buildXLSX(sheets){let zip=new JSZip();let types=['<?xml version="1.0" encoding="UTF-8"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>'];
let book='<?xml version="1.0" encoding="UTF-8"?><workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets>';
let rels='<?xml version="1.0" encoding="UTF-8"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">';
for(let i=0;i<sheets.length;i++){let k=i+1;types.push(`<Override PartName="/xl/worksheets/sheet${k}.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>`);book+=`<sheet name="${xesc(sheets[i][0])}" sheetId="${k}" r:id="rId${k}"/>`;rels+=`<Relationship Id="rId${k}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet${k}.xml"/>`;zip.file(`xl/worksheets/sheet${k}.xml`,xmlSheet(sheets[i][1],sheets[i][0]!=='HUONG_DAN'))}
book+='</sheets></workbook>';rels+=`<Relationship Id="rId${sheets.length+1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>`;
types.push('</Types>');zip.file('[Content_Types].xml',types.join(''));zip.file('_rels/.rels','<?xml version="1.0" encoding="UTF-8"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>');zip.file('xl/workbook.xml',book);zip.file('xl/_rels/workbook.xml.rels',rels);
zip.file('xl/styles.xml','<?xml version="1.0" encoding="UTF-8"?><styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><fonts count="2"><font><sz val="11"/><name val="Calibri"/></font><font><b/><color rgb="FFFFFFFF"/><sz val="11"/><name val="Calibri"/></font></fonts><fills count="3"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill><fill><patternFill patternType="solid"><fgColor rgb="FF155E96"/><bgColor indexed="64"/></patternFill></fill></fills><borders count="1"><border><left/><right/><top/><bottom/><diagonal/></border></borders><cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs><cellXfs count="2"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/><xf numFmtId="0" fontId="1" fillId="2" borderId="0" xfId="0" applyFill="1" applyFont="1"/></cellXfs></styleSheet>');
return zip.generateAsync({type:'blob',compression:'DEFLATE'})}
function saveBlob(name,blob){let u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),3000)}

async function readExcelRows(file,desired){let buf=await file.arrayBuffer(),zip=await JSZip.loadAsync(buf),parse=t=>new DOMParser().parseFromString(t,'application/xml');let workbook=zip.file('xl/workbook.xml'),relFile=zip.file('xl/_rels/workbook.xml.rels');if(!workbook||!relFile)throw Error('Tệp không đúng chuẩn Excel .xlsx');let doc=parse(await workbook.async('text')),rels=parse(await relFile.async('text'));const elements=(node,local)=>Array.from(node.getElementsByTagName('*')).filter(n=>n.localName===local);let targetSheet=elements(doc,'sheet').find(x=>x.getAttribute('name')===desired);if(!targetSheet)throw Error('Không tìm thấy sheet '+desired+'. Vui lòng dùng file mẫu trong ứng dụng.');let rid=targetSheet.getAttribute('r:id')||targetSheet.getAttributeNS('http://schemas.openxmlformats.org/officeDocument/2006/relationships','id');let rel=elements(rels,'Relationship').find(x=>x.getAttribute('Id')===rid);if(!rel)throw Error('Thiếu thông tin liên kết sheet');let path=rel.getAttribute('Target').replace(/^\//,'');path=path.startsWith('xl/')?path:'xl/'+path.replace(/^\.\.\//,'');let entry=zip.file(path);if(!entry)throw Error('Không tìm thấy dữ liệu sheet');let shared=[];if(zip.file('xl/sharedStrings.xml')){let ss=parse(await zip.file('xl/sharedStrings.xml').async('text'));shared=elements(ss,'si').map(si=>elements(si,'t').map(t=>t.textContent).join(''))}
let sheet=parse(await entry.async('text'));let parsed=[];for(let row of elements(sheet,'row')){let number=Number(row.getAttribute('r')||parsed.length+1),values=[];for(let cell of Array.from(row.children).filter(c=>c.localName==='c')){let addr=cell.getAttribute('r')||'',letters=(addr.match(/^[A-Z]+/)||[''])[0],index=0;for(let ch of letters)index=index*26+ch.charCodeAt(0)-64;index--;if(index<0||index>500)continue;let v=Array.from(cell.children).find(c=>c.localName==='v'),inline=Array.from(cell.children).find(c=>c.localName==='is');let txt=v?v.textContent:inline?elements(inline,'t').map(t=>t.textContent).join(''):'';if(cell.getAttribute('t')==='s')txt=shared[Number(txt)]??'';values[index]=txt}if(number>100001)throw Error('File có quá nhiều dòng');parsed[number-1]=values}
let result=parsed.map(r=>r||[]);while(result.length&&!result.at(-1).some(x=>String(x??'').trim()))result.pop();return result}

function csvEscape(v){let t=String(v??'');return /[,;"\r\n]/.test(t)?'"'+t.replace(/"/g,'""')+'"':t}function makeCSV(rows){return '\ufeff'+rows.map(r=>r.map(csvEscape).join(',')).join('\r\n')}function download(name,content,type='text/csv;charset=utf-8'){let blob=new Blob([content],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
const QHEAD=['CHU_DE','NOI_DUNG','A','B','C','D','E','F','G','DAP_AN','LOAI_CAU','GIAI_THICH'];
const QHEAD_OLD=['MA_CAU_HOI','CHU_DE','NOI_DUNG','A','B','C','D','DAP_AN','LOAI_CAU','DO_KHO','GIAI_THICH'];

function showPasteExcel(){if(!requireReady())return;$('#pasteExcelBox')?.remove();let target=$('#questionEditor')||$('#screen');let d=document.createElement('section');d.id='pasteExcelBox';d.className='panel';d.innerHTML=`<h2>Nhập hàng loạt bằng cách dán từ Excel</h2><p><b>Mỗi dòng Excel là 1 câu.</b> Cột theo thứ tự <code>CHU_DE, NOI_DUNG, A, B, C, D, E, F, G, DAP_AN, LOAI_CAU, GIAI_THICH</code>.</p><ol><li>Mở file mẫu Excel và điền nhiều câu trên các dòng 2, 3, 4...</li><li>Chọn toàn bộ vùng dữ liệu <b>gồm hàng tiêu đề</b>, bấm Ctrl+C.</li><li>Bấm vào ô bên dưới, Ctrl+V rồi chọn <b>Kiểm tra dữ liệu đã dán</b>.</li><li>Kiểm tra lỗi và xác nhận nhập các dòng hợp lệ.</li></ol><textarea id='excelPasteText' style='min-height:145px' placeholder='Dán cả bảng Excel có hàng tiêu đề vào đây...'></textarea><div class='actions'><button class='primary' onclick='processPastedExcel()'>Kiểm tra dữ liệu đã dán</button><button onclick="document.getElementById('pasteExcelBox').remove()">Đóng</button></div><p class='note'>Có thể dán hàng trăm câu trong một lần. Không dán dòng ví dụ minh họa vào dữ liệu chính thức. App tự tạo chủ đề chưa có khi xác nhận nhập.</p>`;target.before(d);d.scrollIntoView({behavior:'smooth'});}
function parseExcelPaste(text){let rows=[],row=[],field='',quoted=false;for(let i=0;i<text.length;i++){let c=text[i];if(c==='"'){if(quoted&&text[i+1]==='"'){field+='"';i++;}else quoted=!quoted;}else if(c==='\t'&&!quoted){row.push(field);field='';}else if((c==='\n'||c==='\r')&&!quoted){if(c==='\r'&&text[i+1]==='\n')i++;row.push(field);if(row.some(x=>x.trim()))rows.push(row);row=[];field='';}else field+=c;}row.push(field);if(row.some(x=>x.trim()))rows.push(row);return rows;}
function processPastedExcel(){let raw=$('#excelPasteText')?.value||'';if(!raw.trim())return show('Hãy dán dữ liệu đã sao chép từ Excel.',true);let rows=parseExcelPaste(raw);importType='questions';processImportRows(rows,'Bảng dán từ Excel');}

function parseCSV(text){text=text.replace(/^\ufeff/,'');let result=[],row=[],field='',quoted=false;for(let i=0;i<text.length;i++){let c=text[i];if(quoted){if(c==='"'&&text[i+1]==='"'){field+='"';i++}else if(c==='"')quoted=false;else field+=c}else if(c==='"')quoted=true;else if(c===','){row.push(field);field=''}else if(c==='\n'||c==='\r'){if(c==='\r'&&text[i+1]==='\n')i++;row.push(field);if(row.some(x=>x.trim()))result.push(row);row=[];field=''}else field+=c}if(quoted)throw Error('File CSV có dấu ngoặc kép chưa đóng');row.push(field);if(row.some(x=>x.trim()))result.push(row);return result}
let importType=null,importBuffer=null;
function chooseImport(type){if(!requireReady())return;importType=type;$('#filepick').accept='.xlsx,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet';$('#filepick').value='';$('#filepick').click()}
$('#filepick').onchange=async e=>{let file=e.target.files[0];if(!file)return;try{if(!file.name.toLowerCase().endsWith('.xlsx'))throw Error('Vui lòng chọn tệp Excel .xlsx.');let rows=await readExcelRows(file,importType==='topics'?'CHU_DE':'CAU_HOI');processImportRows(rows,file.name);}catch(err){show('Không thể đọc Excel: '+err.message,true)}};
function processImportRows(rows,sourceName){try{
let header=(rows[0]||[]).map(x=>String(x??'').trim().toUpperCase());
let isTopics=importType==='topics';
let oldHasCode=!isTopics&&header[0]==='MA_CAU_HOI';
let oldFour=!isTopics&&header.includes('DAP_AN')&&header.indexOf('DAP_AN')===6+(oldHasCode?1:0);
let hasDifficulty=header.includes('DO_KHO');
let baseQ=oldFour?['CHU_DE','NOI_DUNG','A','B','C','D','DAP_AN','LOAI_CAU','GIAI_THICH']:QHEAD;
let expected=isTopics?(header[0]==='MA_CHU_DE'?['MA_CHU_DE','CHU_DE']:['CHU_DE']):(oldHasCode?['MA_CAU_HOI']:[]).concat(hasDifficulty?baseQ.slice(0,-1).concat('DO_KHO','GIAI_THICH'):baseQ);
if(!rows.length||header.length!==expected.length||!expected.every((x,i)=>header[i]===x))throw Error('Sai tiêu đề các cột. Hãy tải mẫu Excel mới ngay trong ứng dụng.');
let valid=[],errors=[],offset=oldHasCode?1:0;
for(let i=1;i<rows.length;i++){try{let r=rows[i].map(x=>String(x??'').trim());
if(r.every(x=>!x))continue;
if(isTopics){let name=r[expected.length-1];if(!name)throw Error('Thiếu tên chủ đề');valid.push({name,code:expected.length===2?r[0]:''});continue;}
if(r.length>expected.length&&r.slice(expected.length).some(x=>x))throw Error('Có cột dữ liệu vượt mẫu');
let topicName=r[offset],qtext=r[offset+1];if(!topicName||!qtext)throw Error('Thiếu CHU_DE hoặc NOI_DUNG');
if(/^\[VÍ DỤ\]/i.test(qtext))throw Error('Câu ví dụ không được nhập vào dữ liệu thật');
let optionStart=offset+2,nOptions=oldFour?4:7,opts=r.slice(optionStart,optionStart+nOptions);
while(opts.length&&!opts[opts.length-1])opts.pop();
if(opts.length<2||opts.length>7||opts.some(x=>!x))throw Error('Phải có ít nhất 2 phương án liên tiếp bắt đầu từ A (tối đa G)');
let aIndex=optionStart+nOptions,rawAnswer=(r[aIndex]||'').toUpperCase();
let letters=rawAnswer.split(/[;,\s]+/).filter(Boolean);
if(!letters.length||letters.some(x=>!(/^[A-G]$/.test(x))))throw Error('Đáp án phải là A–G, nhiều đáp án có thể ghi A,C');
let answers=[...new Set(letters.map(x=>'ABCDEFG'.indexOf(x)))];
if(answers.some(x=>x>=opts.length))throw Error('Đáp án trỏ tới phương án chưa nhập');
let type=(r[aIndex+1]||'').toUpperCase();
if(type&&!['MOT','NHIEU'].includes(type))throw Error('LOAI_CAU chỉ dùng MOT hoặc NHIEU, hoặc để trống');
let multiple=type==='NHIEU'||(!type&&answers.length>1);
if(!multiple&&answers.length>1)throw Error('LOAI_CAU=MOT nhưng có nhiều đáp án đúng');
let explain=r[aIndex+(hasDifficulty?3:2)]||'';
valid.push({code:oldHasCode?r[0]:'',topicName,text:qtext,options:opts,correct:answers,multiple,explain});
}catch(err){errors.push(`Dòng ${i+1}: ${err.message}`)}}
const topicNew=isTopics?[]:[...new Set(valid.map(q=>q.topicName).filter(n=>!data.topics.some(t=>t.name.toLowerCase()===n.toLowerCase())))];
importBuffer={type:importType,valid,errors,filename:sourceName,topicNew};
let preview=`<h2>Kiểm tra trước khi nhập: ${esc(sourceName)}</h2><p><b>${valid.length} dòng hợp lệ</b> · ${errors.length} dòng lỗi · ${topicNew.length} chủ đề mới. Mã câu hỏi sẽ được tạo tự động; nội dung trùng được bỏ qua.</p>${topicNew.length?`<div class="notice">Chủ đề sẽ được tạo thêm: ${topicNew.map(esc).join('; ')}</div>`:''}${errors.length?`<div class="notice error">${errors.slice(0,18).map(esc).join('<br>')}${errors.length>18?'…':''}</div>`:''}<div class="actions"><button class="primary" onclick="commitImport()" ${!valid.length?'disabled':''}>Xác nhận nhập ${valid.length} dòng hợp lệ</button><button onclick="cancelImport()">Hủy</button></div>`;
$('#importPreview')?.remove();let anchor=isTopics?$('#screen .panel:last-child'):$('#questionEditor');if(!anchor)anchor=$('#screen');let div=document.createElement('section');div.className='panel';div.id='importPreview';div.innerHTML=preview;anchor.before(div);div.scrollIntoView({behavior:'smooth'});
}catch(e){show('Không thể nhập: '+e.message,true)}};

function cancelImport(){importBuffer=null;$('#importPreview')?.remove()}
async function commitImport(){if(!importBuffer)return;
let {type,valid,topicNew=[]}=importBuffer,added=[],skipped=0;
if(type==='topics'){
let seen=new Set(data.topics.map(t=>t.name.toLowerCase()));for(let x of valid){let key=x.name.toLowerCase();if(seen.has(key)){skipped++;continue}seen.add(key);added.push({id:uid(),name:x.name,code:x.code||'',active:true,updatedAt:now()})}
if(!added.length){show('Không có chủ đề mới.',true);return}
if(!confirm(`Thêm ${added.length} chủ đề?`))return;
if(await saveKind('topics',[...data.topics,...added])){importBuffer=null;show('Đã nhập '+added.length+' chủ đề.')}return;
}
let localTopics=[...data.topics],known=new Map(localTopics.map(t=>[t.name.toLowerCase(),t]));
for(let n of topicNew){if(!known.has(n.toLowerCase())){let t={id:uid(),name:n,code:'',active:true,updatedAt:now()};localTopics.push(t);known.set(n.toLowerCase(),t)}}
let texts=new Set(data.questions.map(q=>(q.topicId+'|'+q.text).toLowerCase())),codes=new Set(data.questions.map(q=>String(q.code||'').toLowerCase()));
for(let x of valid){let topic=known.get(x.topicName.toLowerCase());if(!topic){skipped++;continue}let key=(topic.id+'|'+x.text).toLowerCase();if(texts.has(key)){skipped++;continue}
let code=x.code||uid().replace(/-/g,'').slice(0,16).toUpperCase();if(codes.has(code.toLowerCase())){skipped++;continue}
texts.add(key);codes.add(code.toLowerCase());added.push({id:uid(),code,topicId:topic.id,text:x.text,options:x.options,correct:x.correct,multiple:x.multiple,explain:x.explain,status:'active',revision:1,updatedAt:now()})}
if(!added.length){show(`Không có câu mới; bỏ qua ${skipped} câu trùng.`,true);return}
if(!confirm(`Sẽ nhập ${added.length} câu mới, tạo ${localTopics.length-data.topics.length} chủ đề, bỏ qua ${skipped} câu trùng. Tiếp tục?`))return;
if(localTopics.length!==data.topics.length){if(!await saveKind('topics',localTopics)){show('Chưa ghi câu hỏi do không thể lưu danh mục chủ đề.',true);return}}
let ok=await saveKind('questions',[...data.questions,...added]);if(ok){importBuffer=null;show(`Đã nhập ${added.length} câu; bỏ qua ${skipped} câu trùng.`)}
else show('Dữ liệu câu hỏi chưa được ghi. Có thể thử nhập lại file; chức năng kiểm tra trùng sẽ bỏ qua các câu đã lưu.',true);
}

function exportBackup(){if(!requireReady())return;download('Bank_Exam_Backup_'+new Date().toISOString().slice(0,10)+'.json',JSON.stringify({appName:'MIN BANK EXAM',schemaVersion:SCHEMA,exportedAt:now(),data},null,2),'application/json')}
function importBackup(){let input=document.createElement('input');input.type='file';input.accept='.json';input.onchange=async()=>{try{let v=JSON.parse(await input.files[0].text());if(v.appName!=='MIN BANK EXAM'||v.schemaVersion!==SCHEMA||Object.keys(data).some(k=>!Array.isArray(v.data?.[k])))throw Error('File không đúng cấu trúc backup Bank Exam');window.restoreData=v.data;$('#restorePreview').innerHTML=`<div class="notice">Xem trước khôi phục: ${v.data.questions.length} câu hỏi, ${v.data.topics.length} chủ đề, ${v.data.attempts.length} bài thi, ${v.data.templates.length} mẫu đề. Thao tác sẽ THAY THẾ dữ liệu hiện tại. Hãy xuất backup trước.</div><button class="danger" onclick="commitRestore()">Xác nhận khôi phục (thay thế)</button>`}catch(e){show('Không đọc được bản sao lưu: '+e.message,true)}};input.click()}
async function commitRestore(){if(!window.restoreData||!confirm('Xác nhận thay thế TẤT CẢ dữ liệu hiện tại bằng file đã chọn?'))return;for(const k of Object.keys(data)){let ok=await saveKind(k,window.restoreData[k]);if(!ok){show('Khôi phục bị ngắt; kiểm tra và khôi phục lại từ backup nếu cần.',true);return}}window.restoreData=null;go('storage');show('Đã khôi phục và đối soát các nhóm dữ liệu')}
